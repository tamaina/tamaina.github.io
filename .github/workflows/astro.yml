name: Astro checks and deployment
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_preview:
        description: Deploy preview instead of production (main only)
        type: boolean
        default: false
concurrency:
  group: astro-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.deploy_preview && 'preview' || 'production' }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui
      - name: Build the verified deployment with Cloudflare image URLs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: pnpm build
        env:
          IMAGE_MODE: cloudflare
          IMAGE_ORIGIN: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_preview && 'https://astro-preview.a9z.dev' || 'https://a9z.dev' }}
      - name: Verify article and original inputs are unchanged
        run: git diff --exit-code -- docs
      - uses: actions/upload-artifact@v4
        with:
          name: verified-site
          path: |
            dist
            .generated/report.json
            .generated/assets.json
          include-hidden-files: true
          retention-days: 7
          compression-level: 0
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    # Reuse the configured Cloudflare credentials for both isolated Workers.
    environment:
      name: cloudflare-preview
      url: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_preview && 'https://astro-preview.a9z.dev' || 'https://a9z.dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: verified-site
          path: .
      - name: Deploy preview
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_preview
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy production
        if: github.event_name != 'workflow_dispatch' || !inputs.deploy_preview
        run: pnpm exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify deployed originals, routes, and actual transformations
        run: |
          pnpm verify:remote
          node scripts/verify-site.mjs
        env:
          VERIFY_ORIGIN: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_preview && 'https://astro-preview.a9z.dev' || 'https://a9z.dev' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-verification
          path: .generated/verification
          retention-days: 7
